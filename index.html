<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMORA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14532d">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f1e8;color:#1a1a1a}
header{background:#14532d;color:#facc15;padding:20px;text-align:center}
header h1{margin:0;font-size:32px;letter-spacing:3px}
header p{margin:6px 0 0;color:#fff}
main{padding:14px;max-width:600px;margin:auto}
.btn{display:block;text-align:center;padding:14px;margin:8px 0;border-radius:8px;font-weight:bold;text-decoration:none;font-size:17px}
.jaune{background:#facc15;color:#14532d}
.vert{background:#14532d;color:#fff}
.carte{background:#fff;border:3px solid #14532d;border-radius:10px;padding:14px;margin:16px 0}
.carte h2{margin:0;color:#14532d}
.metier{color:#555;margin:4px 0 10px}
h3{background:#facc15;color:#14532d;padding:6px 10px;border-radius:6px;margin:16px 0 8px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos img,video{width:100%;border-radius:8px}
.vide{color:#777;font-style:italic}
</style>
</head>
<body>
<header><h1>LUMORA</h1><p>Trouvez un professionnel à Yopougon</p></header>
<main>
<a class="btn jaune" id="inscrire" href="#">Je suis un professionnel : m'inscrire</a>
<div id="liste"></div>
</main>
<script>
var LUMORA_WA="2250715898210";
var PROS=[
 {
  nom:"Fome Badra Ali",
  metier:"Menuisier professionnel",
  tel:"0544853364",
  wa:"2250544853364",
  photos:["IMG-20261122-WA0015.jpg","IMG-20261122-WA0016.jpg","IMG-20261122-WA0014.jpg","IMG-20261122-WA0012.jpg"],
  videos:[]
 }
];
document.getElementById("inscrire").href="https://wa.me/"+LUMORA_WA+"?text="+encodeURIComponent("Bonjour LUMORA, je veux m'inscrire. Mon nom : ... Mon métier : ...");
var html="";
PROS.forEach(function(p){
 html+='<div class="carte"><h2>'+p.nom+'</h2><div class="metier">'+p.metier+'</div>';
 html+='<a class="btn vert" href="tel:'+p.tel+'">Appeler</a>';
 html+='<a class="btn jaune" href="https://wa.me/'+p.wa+'">WhatsApp</a>';
 html+='<h3>Photos</h3>';
 if(p.photos.length){html+='<div class="photos">'+p.photos.map(function(f){return '<img src="'+f+'">';}).join("")+'</div>';}
 else{html+='<p class="vide">Photos bientôt</p>';}
 html+='<h3>Vidéos</h3>';
 if(p.videos.length){html+=p.videos.map(function(f){return '<video controls src="'+f+'"></video>';}).join("");}
 else{html+='<p class="vide">Vidéos bientôt</p>';}
 html+='</div>';
});
document.getElementById("liste").innerHTML=html;
</script>
</body>
</html>
